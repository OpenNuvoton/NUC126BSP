project:
  packs:
    - pack: Nuvoton::NuMicroM0_DFP
  misc:
    - for-compiler: AC6
      C: [-std=c99, -flto, -fno-rtti, -funsigned-char, -fshort-enums, -fshort-wchar, -ffunction-sections, -fdata-sections, -D__MICROLIB, -gdwarf-4]
      ASM: [-D__MICROLIB, -DStack_Size=0x1000]
      Link: [--lto, --library_type=microlib, --map, --load_addr_map_info, --symbols, --info sizes, --info totals, --entry Reset_Handler, --summary_stderr, --info summarysizes, --diag_suppress=6314]
  setups:
    - output:
        type: ["bin"]
  add-path:
        - ../../../../Library/CMSIS/Include
        - ../../../../Library/Device/Nuvoton/NUC126/Include
        - ../../../../Library/StdDriver/inc
  linker:
    - script: ../../../../Library/Device/Nuvoton/NUC126/Source/ARM/LDROM.sct
      for-compiler: AC6
  groups:
    - group: CMSIS
      files:
        - file: ../../../../Library/Device/Nuvoton/NUC126/Source/ARM/startup_NUC126.S
          for-compiler: AC6
        - file: ../../../../Library/Device/Nuvoton/NUC126/Source/system_NUC126.c
    - group: User
      files:
        - file: ../descriptors.c
        - file: ../main.c
        - file: ../hid_transfer.c
        - file: ../fmc_user.c
        - file: ../isp_user.c
        - file: ../targetdev.c
        - file: ../usbd_user.c
